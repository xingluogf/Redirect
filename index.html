<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小沈秋游戏工作室 · 入口</title>
    <meta name="description" content="小沈秋游戏工作室 - 入口页面">
    <link rel="icon" href="./asset/maple.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            min-height: 100vh;
            background-color: #0f1117;
            color: #e6edf3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .tip-banner {
            color: #d4a066;
            border: 1px solid #d4a06640;
            background: rgba(212, 160, 102, 0.08);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 32px;
        }
        h1 {
            font-size: 2.4rem;
            color: #d4a066;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #8b949e;
            font-size: 1rem;
            margin-bottom: 48px;
        }
        .jump-btn {
            padding: 16px 42px;
            font-size: 1.1rem;
            border: 1px solid #d4a066;
            color: #d4a066;
            background: transparent;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .jump-btn:hover {
            background-color: #d4a066;
            color: #0f1117;
            box-shadow: 0 0 20px rgba(212, 160, 102, 0.4);
        }
        .footer-text {
            margin-top: 60px;
            color: #6e7681;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tip-banner">🔔 新站正在建设中</div>
        <h1>小沈秋游戏工作室</h1>
        <p class="subtitle">点击下方按钮前往官网</p>
        <button class="jump-btn" onclick="location.href='https://shenqiu.ravarj.cn/'">进入官网</button>
        <div class="footer-text">© 2026 小沈秋游戏工作室</div>
    </div>
</body>
</html>
